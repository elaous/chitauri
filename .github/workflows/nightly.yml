name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: graphene_attest
          POSTGRES_PASSWORD: graphene_attest
          POSTGRES_DB: graphene_attest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graphene_attest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://graphene_attest:graphene_attest@localhost:5432/graphene_attest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run full test suite
        run: uv run pytest -q
