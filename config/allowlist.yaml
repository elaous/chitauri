# verifiedBootKey SHA-256 allowlist. Placeholders: verify against vendor fingerprints.

os_allowlist:
  - id: grapheneos
    display_name: "GrapheneOS"
    expected_verified_boot_state: "SelfSigned" # relocked with user-generated AVB key
    require_device_locked: true
    verified_boot_keys:
      []

  - id: stock_android
    display_name: "Stock / Google-certified Android"
    expected_verified_boot_state: "Verified"
    require_device_locked: true
    verified_boot_keys: []

policy:
  # Reject any patch level older than this many days
  max_patch_age_days: 90
  # Minimum acceptable attestation security level: "TrustedEnvironment" or "StrongBox"
  min_security_level: "TrustedEnvironment"
