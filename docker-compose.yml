services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: graphene_attest
      POSTGRES_PASSWORD: graphene_attest
      POSTGRES_DB: graphene_attest
    ports:
      - "5432:5432"
    volumes:
      - graphene_attest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphene_attest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  graphene_attest_pgdata:
